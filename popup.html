<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aviator Analyzer</title><style>body{font:14px system-ui;width:330px;margin:0;padding:16px;background:#101114;color:#eee}h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#1b1d22;padding:10px;border-radius:10px}.v{font-size:20px;font-weight:700}.muted{color:#9aa0aa}.signal{margin-top:12px;padding:12px;border-radius:10px;background:#252830}.rounds{margin-top:12px;max-height:150px;overflow:auto;line-height:1.7}button{margin-top:10px;width:100%;padding:9px;border:0;border-radius:8px}</style></head>
<body><h2>Aviator Analyzer</h2><div class="muted">Read-only statistical monitor</div><div class="grid" style="margin-top:12px"><div class="card"><div class="muted">Rounds</div><div id="count" class="v">0</div></div><div class="card"><div class="muted">Average</div><div id="avg" class="v">—</div></div><div class="card"><div class="muted">&lt;2x rate</div><div id="low" class="v">—</div></div><div class="card"><div class="muted">High ≥5x</div><div id="high" class="v">—</div></div></div><div class="signal"><div class="muted">Current statistical state</div><div id="signal" class="v">Collecting…</div></div><div id="rounds" class="rounds"></div><button id="clear">Clear history</button><script src="popup.js"></script></body></html>
